<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Not in this preview — ATV Power</title>
<style>
  :root{
    --ink:#ffffff; --ink-2:#f4f4f4; --white:#171a20; --mist:#5c5e62;
    --mist-2:#77797e; --volt:#004750; --line-soft:#ececed; --radius:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--ink); color:var(--white);
    font-family:"Gotham SSm A","Gotham SSm B",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:32px;text-align:center;
  }
  .box{max-width:44ch}
  .eyebrow{
    font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--volt);font-weight:600;margin:0 0 16px
  }
  h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:600;letter-spacing:-.02em;margin:0 0 16px}
  p{font-size:.98rem;line-height:1.62;color:var(--mist);margin:0 0 30px}
  a.btn{
    display:inline-block;background:var(--volt);color:#fff;text-decoration:none;
    font-size:.92rem;font-weight:600;padding:13px 28px;border-radius:99px;
    transition:background .18s ease
  }
  a.btn:hover{background:#00323a}
</style>
</head>
<body>
  <div class="box">
    <p class="eyebrow">ATV Power · Internal preview</p>
    <h1>That page isn't in this preview</h1>
    <p>This preview covers the three powertrain product pages only. Charging, batteries, workboats and the pricing configurator are linked from the navigation but haven't been published here yet.</p>
    <a class="btn" href="/">Back to the preview</a>
  </div>
</body>
</html>
